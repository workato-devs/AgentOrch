name: Feature request
description: Propose a scoped improvement to AgentOrch.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Research or user need
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the interface, workflow, or documentation change.
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Benchmark contract impact
      options:
        - No scoring or dataset change
        - Additive adapter or tooling change
        - Changes scoring, fixtures, or dataset membership
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or related projects.
